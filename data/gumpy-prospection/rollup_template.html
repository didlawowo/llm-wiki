<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 2000px; }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #ffffff;
    position: relative;
    overflow: hidden;
  }

  /* Fond : dégradé doux haut crème → blanc */
  .bg {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #f5f5f2 0%, #ffffff 18%);
  }

  /* ===== HEADER ===== */
  .header {
    position: absolute; top: 40px; left: 0; right: 0;
    text-align: center;
  }
  .logo { height: 130px; }
  .headline {
    margin-top: 55px;
    font-size: 42px; font-weight: 800; letter-spacing: -0.5px;
  }
  .headline .pin {
    display: inline-block; width: 22px; height: 22px;
    background: #226638; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    margin-right: 14px; position: relative; top: 2px;
  }
  .headline .black { color: #141414; }
  .headline .teal  { color: #008794; }

  /* ===== FLÈCHE ===== */
  .arrow {
    position: absolute; left: 50%; top: 305px;
    transform: translateX(-50%);
    width: 34px; height: 110px;
    background: linear-gradient(180deg, #6abe4a 0%, #008794 100%);
    clip-path: polygon(0 0, 100% 0, 100% 75%, 50% 100%, 0 75%);
  }

  /* ===== VISUEL ===== */
  .frame {
    position: absolute; left: 50%; top: 430px;
    transform: translateX(-50%);
    width: 340px; height: 520px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .frame img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ===== BÉNÉFICES ===== */
  .benefits {
    position: absolute; left: 50%; top: 1040px;
    transform: translateX(-50%);
    width: 560px;
  }
  .benefit {
    display: flex; align-items: center;
    margin-bottom: 28px;
  }
  .benefit .dot {
    width: 26px; height: 26px; border-radius: 50%;
    flex-shrink: 0; margin-right: 22px;
  }
  .benefit .txt { font-size: 22px; color: #141414; font-weight: 600; }
  .b1 .dot { background: #008794; }
  .b2 .dot { background: #008794; }
  .b3 .dot { background: #ff9800; }

  /* ===== FOOTER ===== */
  .footer {
    position: absolute; bottom: 0; left: 0; right: 0; height: 300px;
    background: #1e2d37;
    display: flex; align-items: center;
    padding: 0 70px;
  }
  .qr-zone {
    display: flex; align-items: center;
    gap: 40px;
  }
  .qr-box {
    width: 150px; height: 150px;
    background: #ffffff; padding: 8px;
    border-radius: 10px;
  }
  .qr-box img { width: 100%; height: 100%; display: block; }
  .qr-text { color: #c8d2d7; font-size: 16px; line-height: 1.6; }
  .slogan {
    margin-left: auto;
    color: #ffffff; font-size: 26px; font-weight: 600;
    font-style: italic;
  }
  .footer-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: #ffffff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px;
    font-size: 16px; color: #141414; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="header">
    <img class="logo" src="file:///opt/data/prospecting_mairies/gumpy_logo.png" alt="Gumpy">
    <div class="headline">
      <span class="pin"></span>
      <span class="black">Trouvez votre </span><span class="teal">PhotoBox ici !</span>
    </div>
  </div>

  <div class="arrow"></div>

  <div class="frame">
    <img src="file:///opt/data/prospecting_mairies/__VISUEL__" alt="Photobooth Gumpy">
  </div>

  <div class="benefits">
    <div class="benefit b1"><div class="dot"></div><div class="txt">Une expérience fun &amp; premium</div></div>
    <div class="benefit b2"><div class="dot"></div><div class="txt">Des souvenirs instantanés</div></div>
    <div class="benefit b3"><div class="dot"></div><div class="txt">Partagez, imprimez, profitez !</div></div>
  </div>

  <div class="footer">
    <div class="qr-zone">
      <div class="qr-box"><img src="file:///opt/data/prospecting_mairies/gumpy_qr.png" alt="QR"></div>
      <div class="qr-text">Scannez-moi ou<br>rendez-vous sur<br><b>gumpy.fr</b></div>
    </div>
    <div class="slogan">Souriez, on s'occupe du reste.</div>
    <div class="footer-bar">
      <span>gumpy.fr</span>
      <span>gumpy.fr · @gumpy.photo</span>
    </div>
  </div>
</body>
</html>
